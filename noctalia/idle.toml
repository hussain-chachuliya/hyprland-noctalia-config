[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]
pre_action_fade_seconds = 0

    [idle.behavior.screen-off]
    action = "screen_off"
    timeout = 180
    locked_timeout = 3
    enabled = true

    [idle.behavior.lock]
    action = "lock"
    timeout = 180
    enabled = true

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    timeout = 300
    enabled = true